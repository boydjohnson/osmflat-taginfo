name: release

# Tagging `v*` publishes a release. `workflow_dispatch` builds the same matrix
# without publishing, which is the only way to find out that a target broke
# before a tag is already cut and public.
#
# Same two platforms osmflat-rs and osmflat-ext ship: this reads archives built
# by osmflatc and osmflat-extc, so a platform those can't run on is of no use
# here either. The Linux triple differs from theirs -- they ship glibc, this
# ships static musl -- which is fine, because the parity that matters is being
# runnable on the same machines, and musl is runnable on strictly more of them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (off = build and upload artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing shouldn't hide whether the other is healthy.
      fail-fast: false
      matrix:
        include:
          # musl, not gnu: a glibc build links against the runner's glibc and
          # won't start on any distro older than it, which made the runner
          # image an ABI decision -- pinning 22.04 only to hold the floor down.
          # Static musl has no floor, so the runner can float with `latest`.
          #
          # Nothing in the tree compiles C (no `cc`, no `*-sys` beyond `libc`
          # and `linux-raw-sys`), so rustc's bundled musl libc links this on
          # its own and no `musl-tools` install is needed. A future dependency
          # with a C component would change that, and would fail here loudly.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `serve` is not a default feature, so a plain build ships a CLI with no
      # HTTP API -- the `serve` subcommand simply wouldn't exist in the released
      # binary. Downloaders get the whole tool.
      #
      # --locked: a published binary should be built from the dependency graph
      # recorded in the tag, not whatever resolved that morning. It matters more
      # here than most places -- `osmflat` is tracked by branch, so without the
      # lock this would float with whatever osmflat-rs main points at.
      - name: Build
        run: cargo build --locked --profile dist --features serve --target ${{ matrix.target }}

      # Catches a binary that built but can't run, and asserts the feature
      # actually made it in rather than silently shipping a CLI-only build.
      - name: Smoke test
        run: |
          bin="target/${{ matrix.target }}/dist/osmflat-taginfo"
          "$bin" --version
          "$bin" --help > /dev/null
          "$bin" serve --help > /dev/null
          # The musl build is only worth having if it is actually static --
          # a dependency that pulls in a C component would quietly produce a
          # dynamically linked binary that still passes every check above and
          # then fails on the machines musl was chosen for.
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            file "$bin"
            file "$bin" | grep -q "static-pie linked\|statically linked"
          fi

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="osmflat-taginfo"))')"
          name="osmflat-taginfo-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/dist/osmflat-taginfo" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          # Apache-2.0, BSD-3-Clause and Unicode-3.0 dependencies all require
          # their notices to travel with a redistributed binary. Generated per
          # target from the locked graph, so it lists what actually linked --
          # and it runs after the build, when the registry sources it reads the
          # license texts out of are already on disk.
          python3 scripts/third-party-notices.py \
            --target "${{ matrix.target }}" \
            --features serve \
            -o "dist/$name/THIRD-PARTY-NOTICES.md"
          cd dist
          tar czf "$name.tar.gz" "$name"
          echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: publish
    needs: build
    # Only a tag publishes. A dispatch run stops after `build`, leaving the
    # artifacts downloadable from the run for inspection.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One checksum file over every archive, so a download can be verified
      # without trusting the transport.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes \
            artifacts/*

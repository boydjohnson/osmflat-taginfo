[package]
name = "osmflat-taginfo"
version = "0.1.0"
edition = "2021"
description = "A taginfo.openstreetmap.org-compatible CLI over osmflat + osmflat-ext sidecars."
license = "MIT/Apache-2.0"

[[bin]]
name = "osmflat-taginfo"
path = "src/main.rs"

[dependencies]
# The taginfo query layer (this CLI is a pure reader/formatter over it).
osmflat-ext = { git = "https://github.com/boydjohnson/osmflat-ext", rev = "48920277cf1e2ffa3d0b05ccfd80d8698ea50f6a" }
# NOT rev-pinned, deliberately. This must resolve to the exact same `osmflat`
# that osmflat-ext was built against or their types don't unify (the build
# fails with E0308 between two copies of the same commit). osmflat-ext declares
# `osmflat` by branch, and cargo treats `?branch=main` and `?rev=<sha>` as
# distinct sources even at an identical commit -- so matching its branch is the
# only way to share one copy. A `[patch]` can't fix this: cargo canonicalizes
# git URLs, so patching this URL with itself is rejected. To pin this too,
# osmflat-ext must first pin `osmflat` by rev in its own manifest.
osmflat = { git = "https://github.com/boydjohnson/osmflat-rs", branch = "main" }
clap = { version = "4.1", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps struct field order through serde_json::Value, so output
# matches taginfo's field order byte-for-byte (design §4).
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
time = "0.3"

# HTTP layer for `serve` mode, all optional so a plain CLI-only build stays
# free of the async runtime (see `serve` feature below).
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }

[features]
serve = ["dep:axum", "dep:tokio", "dep:tower-http"]

[dev-dependencies]
# test-support exposes synthetic in-memory parent + sidecar builders, so unit
# tests run each endpoint against a known fixture (design §9).
osmflat-extc = { git = "https://github.com/boydjohnson/osmflat-ext", rev = "48920277cf1e2ffa3d0b05ccfd80d8698ea50f6a", features = ["test-support"] }
# ServiceExt::oneshot, for driving the `serve`-mode router in tests without a
# real socket.
tower = { version = "0.5", features = ["util"] }

# What `release.yml` ships. Debug symbols are dead weight in a download, and
# nothing here needs them at runtime.
[profile.dist]
inherits = "release"
strip = "symbols"
